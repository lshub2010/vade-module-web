[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-module"
version = "1.0.0"
description = "Vade module: http(s) GET/HEAD with SSRF protection, redirect cap and size limits"
requires-python = ">=3.10"
dependencies = ["vade-sdk==0.1.*"]

[project.optional-dependencies]
core = ["vade-sdk[core]==0.1.*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
